# ============================================================================
# Trimmed production stack for a single always-on VPS (the "one server" route).
# Runs: Postgres + ClickHouse + API + Web behind Caddy (automatic HTTPS).
# Heavy blueprint services (Kafka, Vector, Keycloak, Kong, Redis) are omitted
# because the as-built app does not strictly require them.
#
# Usage:
#   1. Copy to the VPS as docker-compose.yml (or keep the name and run
#      `docker compose -f docker-compose.deploy.yml up -d`).
#   2. Edit DOMAIN, JWT_SECRET, and Postgres/ClickHouse passwords below.
#   3. `docker compose up -d`  (Caddy gets a free Let's Encrypt cert on first run).
#
# The web container talks to the API via the internal docker network at
# http://api:3001, and the browser only ever hits https://DOMAIN (Caddy).
# ============================================================================

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dataviz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: dataviz
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_DB: industrial_analytics
      CLICKHOUSE_USER: dataviz
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change_me}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch_data:/var/lib/clickhouse
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://dataviz:${POSTGRES_PASSWORD:-change_me}@postgres:5432/dataviz
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: dataviz
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change_me}
      CLICKHOUSE_DB: industrial_analytics
      JWT_SECRET: ${JWT_SECRET:-change_me_long_random}
      CORS_ORIGIN: https://${DOMAIN:-localhost}
    depends_on:
      - postgres
      - clickhouse
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN:-localhost}/api/v1
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  ch_data:
  caddy_data:
  caddy_config:
